schema = 1

[code_policy]
mode = "report"
include = ["src/**/*.ts", "src/**/*.tsx"]
exclude = ["**/*.test.*", "**/generated/**"]

[[code_policy.rule]]
id = "no-new-comment"
kind = "comment"

[[code_policy.rule]]
id = "no-new-effect"
kind = "pattern"
pattern = '\buse(Layout)?Effect\s*\('

[[code_policy.rule]]
id = "no-new-suppression"
kind = "pattern"
pattern = '(eslint-disable|@ts-ignore|@ts-expect-error)'
