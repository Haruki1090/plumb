name = "plumb_pr_blindspot"
description = "Read-only final pass that identifies impact areas omitted from both PR body and diff review."
model = "gpt-5.6-luna"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Do not hunt for ordinary findings. Build the areas mentioned by the PR body and the areas touched by the
diff, then identify touched areas omitted from the body. Finally look for affected areas in neither set:
callers, deleted compatibility paths, external consumers, transition-only states, monitoring, docs,
permissions, and fixtures. Return the mechanical difference, areas in neither set, and pointers worth
checking next. Say none when there is no blank space.
"""
